<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Commerce for Local Farmers | Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Permanent+Marker&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="stage">

    <!-- FRONT -->
    <div class="card card--front">
      <img class="brand-logo" src="assets/cart-logo.svg" width="110" height="110" alt="Commerce for Local Farmers logo" />
      <h1 class="brand-title">Commerce</h1>
      <p class="brand-sub">for <span>Local Farmers</span></p>
      <p class="brand-motto">LOCAL ROOTS &nbsp;•&nbsp; STRONGER COMMUNITY &nbsp;•&nbsp; BETTER FUTURE</p>

      <p class="front-tagline">Explore, Dream, Discover</p>
    </div>

    <!-- BACK -->
    <div class="card card--back">
      <img class="brand-logo brand-logo--small" src="assets/cart-logo.svg" width="72" height="72" alt="Commerce for Local Farmers logo" />
      <h2 class="brand-title brand-title--small">Commerce</h2>
      <p class="brand-sub brand-sub--small">for <span>Local Farmers</span></p>

      <div class="back-bottom">
        <div class="qr-block">
          <img class="qr-code" src="assets/qr-pattern.svg" alt="QR code" />
          <p class="qr-label">SCAN TO<br/>CONNECT &amp;<br/>EXPLORE</p>
        </div>

        <div class="right-col">
          <h3 class="person-name">Keah Nadine Bialao</h3>
          <p class="person-role">Travel Expert</p>

          <ul class="contact-list">
            <li><i class="fa-solid fa-phone"></i><span>09554114150</span></li>
            <li><i class="fa-solid fa-envelope"></i><span>keahnadine@gmail.com</span></li>
            <li><i class="fa-solid fa-location-dot"></i><span>@dreamflighttours</span></li>
          </ul>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
